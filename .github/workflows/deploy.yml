name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Lets a deploy be re-run from the Actions tab without an empty commit.
  workflow_dispatch:

# Nothing by default, each job asks for what it needs.
permissions: {}

# Queue deployments instead of racing them. cancel-in-progress is deliberately
# false: cutting off a deploy that is already uploading leaves Pages serving a
# half-published tree, and the next push supersedes it a moment later anyway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      # build.sh runs the type check and the build through bun.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.2.16"

      # package-lock.json is the only lockfile, npm ci installs exactly the
      # tree it records and fails if it is out of sync with package.json. No
      # dependency needs an install script to build.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # vite-plugin-singlefile inlines every asset into dist/index.html, so the
      # page works under any base path and needs none configured.
      - name: Build
        env:
          SKIP_INSTALL: "1"
        run: ./build.sh

      - name: Verify output
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html missing"; exit 1; }
          test -f dist/.nojekyll || { echo "::error::dist/.nojekyll missing"; exit 1; }
          echo "Published tree:"
          find dist -type f | sort

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
